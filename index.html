<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball Game - Noob Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        h1 {
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .score-board {
            display: flex;
            gap: 40px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        #gameCanvas {
            border: 5px solid white;
            background: linear-gradient(to bottom, #87ceeb 0%, #90EE90 100%);
            display: block;
            cursor: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .controls {
            color: white;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            line-height: 1.8;
        }

        .controls h3 {
            margin-bottom: 10px;
        }

        .shoot-timer {
            margin-top: 20px;
            color: white;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            min-height: 30px;
        }

        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 10px;
            color: white;
            text-align: center;
            display: none;
            z-index: 1000;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        }

        .game-over h2 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        .game-over p {
            font-size: 24px;
            margin: 10px 0;
        }

        .game-over button {
            margin-top: 20px;
            padding: 10px 30px;
            font-size: 18px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .game-over button:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏀 Basketball Noob Edition 🏀</h1>
        <div class="score-board">
            <div>Your Score: <span id="playerScore">0</span></div>
            <div>Target: 21</div>
        </div>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div class="controls">
            <h3>Controls</h3>
            <div><strong>WASD</strong> - Move</div>
            <div><strong>E</strong> - Shoot (time it perfect!)</div>
            <div><strong>Z</strong> - Euro Step</div>
            <div><strong>X</strong> - Crossover</div>
        </div>
        <div class="shoot-timer" id="shootTimer"></div>
    </div>

    <div class="game-over" id="gameOverScreen">
        <h2 id="gameOverTitle">Game Over!</h2>
        <p id="gameOverMessage"></p>
        <button onclick="location.reload()">Play Again</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game variables
        const player = {
            x: 100,
            y: canvas.height / 2,
            width: 20,
            height: 40,
            speed: 4,
            score: 0,
            isShooting: false,
            shootTimer: 0,
            shootCooldown: 0,
            isMoving: false,
            lastDirection: 1
        };

        const hoop = {
            x: canvas.width - 80,
            y: 80,
            width: 40,
            height: 10
        };

        const ball = {
            x: player.x + player.width / 2,
            y: player.y - 20,
            radius: 8,
            vx: 0,
            vy: 0,
            active: false,
            gravity: 0.3
        };

        const keys = {};
        let gameOver = false;
        let shootingActive = false;
        let shootTimerValue = 0;
        const shootTimerMax = 60;

        // Event listeners
        document.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;

            if (e.key.toLowerCase() === 'e' && !gameOver) {
                if (!shootingActive && !player.isShooting) {
                    startShooting();
                }
            }

            if (e.key.toLowerCase() === 'z' && !gameOver) {
                euroStep();
            }

            if (e.key.toLowerCase() === 'x' && !gameOver) {
                crossover();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        function startShooting() {
            shootingActive = true;
            shootTimerValue = 0;
            player.isShooting = true;
        }

        function euroStep() {
            if (!ball.active) {
                player.x += player.lastDirection * 15;
                player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
            }
        }

        function crossover() {
            if (!ball.active) {
                player.lastDirection *= -1;
            }
        }

        function shoot() {
            const perfect = shootTimerValue > 25 && shootTimerValue < 35;
            const good = shootTimerValue > 20 && shootTimerValue < 40;

            ball.x = player.x + player.width / 2;
            ball.y = player.y - 20;
            ball.active = true;

            const distance = hoop.x - player.x;
            const heightDiff = hoop.y - player.y;

            let power = 1;
            let accuracy = 1;

            if (perfect) {
                power = 1.2;
                accuracy = 1;
            } else if (good) {
                power = 0.9;
                accuracy = 0.7;
            } else {
                power = 0.6;
                accuracy = 0.3;
            }

            const angle = Math.atan2(heightDiff, distance);
            const baseSpeed = 8 * power;

            ball.vx = Math.cos(angle) * baseSpeed + (Math.random() - 0.5) * (2 - accuracy * 2);
            ball.vy = Math.sin(angle) * baseSpeed + (Math.random() - 0.5) * (2 - accuracy * 2);

            shootingActive = false;
            player.isShooting = false;
            player.shootCooldown = 30;
        }

        function updateGame() {
            if (gameOver) return;

            // Player movement
            if (keys['w']) {
                player.y = Math.max(0, player.y - player.speed);
            }
            if (keys['s']) {
                player.y = Math.min(canvas.height - player.height, player.y + player.speed);
            }
            if (keys['a']) {
                player.x = Math.max(0, player.x - player.speed);
                player.lastDirection = -1;
            }
            if (keys['d']) {
                player.x = Math.min(canvas.width - player.width, player.x + player.speed);
                player.lastDirection = 1;
            }

            // Shooting timer
            if (shootingActive) {
                shootTimerValue++;
                if (shootTimerValue > shootTimerMax) {
                    shoot();
                }
            }

            // Ball physics
            if (ball.active) {
                ball.x += ball.vx;
                ball.y += ball.vy;
                ball.vy += ball.gravity;

                // Ball out of bounds
                if (ball.y > canvas.height + 50 || ball.x < -50 || ball.x > canvas.width + 50) {
                    ball.active = false;
                }

                // Check if ball goes in hoop
                if (
                    ball.x > hoop.x - ball.radius &&
                    ball.x < hoop.x + hoop.width + ball.radius &&
                    ball.y > hoop.y - ball.radius &&
                    ball.y < hoop.y + hoop.height + ball.radius &&
                    ball.vy > 0
                ) {
                    player.score += 2;
                    ball.active = false;

                    document.getElementById('playerScore').textContent = player.score;

                    if (player.score >= 21) {
                        endGame(true);
                    }
                }
            }

            if (player.shootCooldown > 0) {
                player.shootCooldown--;
            }
        }

        function drawGame() {
            // Clear canvas
            ctx.fillStyle = 'rgba(135, 206, 235, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw court line
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // Draw baseline
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(canvas.width - 50, 0);
            ctx.lineTo(canvas.width - 50, canvas.height);
            ctx.stroke();

            // Draw hoop
            ctx.fillStyle = 'rgba(255, 100, 0, 0.8)';
            ctx.fillRect(hoop.x, hoop.y, hoop.width, hoop.height);
            ctx.strokeStyle = '#FF6400';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(hoop.x - 30, hoop.y);
            ctx.lineTo(hoop.x + hoop.width + 30, hoop.y);
            ctx.stroke();

            // Backboard
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.fillRect(hoop.x - 5, hoop.y - 50, hoop.width + 10, 50);

            // Draw player (noob style)
            ctx.fillStyle = '#FF6B6B';
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Draw player head
            ctx.fillStyle = '#FFD93D';
            ctx.beginPath();
            ctx.arc(player.x + player.width / 2, player.y - 10, 8, 0, Math.PI * 2);
            ctx.fill();

            // Draw sad noob face
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(player.x + player.width / 2 - 3, player.y - 12, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(player.x + player.width / 2 + 3, player.y - 12, 2, 0, Math.PI * 2);
            ctx.fill();

            // Sad mouth
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(player.x + player.width / 2, player.y - 8, 3, 0, Math.PI);
            ctx.stroke();

            // Draw ball if active
            if (ball.active) {
                ctx.fillStyle = '#FF8C00';
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fill();

                // Basketball lines
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(ball.x, ball.y - ball.radius);
                ctx.lineTo(ball.x, ball.y + ball.radius);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius / 2, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Draw shooting indicator
            if (shootingActive) {
                const progress = shootTimerValue / shootTimerMax;
                ctx.fillStyle = progress > 0.4 && progress < 0.6 ? '#00FF00' : '#FF4444';
                ctx.fillRect(player.x - 10, player.y - 50, 40 * progress, 5);
                ctx.strokeStyle = '#FFF';
                ctx.lineWidth = 2;
                ctx.strokeRect(player.x - 10, player.y - 50, 40, 5);
            }
        }

        function endGame(won) {
            gameOver = true;
            const screen = document.getElementById('gameOverScreen');
            const title = document.getElementById('gameOverTitle');
            const message = document.getElementById('gameOverMessage');

            if (won) {
                title.textContent = '🎉 You Won! 🎉';
                message.textContent = `You scored 21 points! Not bad for a noob!`;
                title.style.color = '#00FF00';
            } else {
                title.textContent = 'Game Over';
                message.textContent = `You scored ${player.score} points. Keep practicing!`;
                title.style.color = '#FF4444';
            }

            screen.style.display = 'block';
        }

        function updateUI() {
            const shooterDiv = document.getElementById('shootTimer');
            if (shootingActive) {
                const progress = Math.floor((shootTimerValue / shootTimerMax) * 100);
                const perfect = shootTimerValue > 25 && shootTimerValue < 35;
                shooterDiv.textContent = perfect ? '⭐ PERFECT TIMING! Press E to shoot!' : `Timing: ${progress}%`;
                shooterDiv.style.color = perfect ? '#FFD700' : '#FFF';
            } else {
                shooterDiv.textContent = '';
            }
        }

        function gameLoop() {
            updateGame();
            drawGame();
            updateUI();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
